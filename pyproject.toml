[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subtitle-translate"
version = "0.1.0"
description = "Command line utility for translating subtitle files"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Maksym Kozlenko" }]
dependencies = [
    "openai>=1.40,<4",
    "pydantic>=2.6,<3",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
subtitle-translate = "subtitle_translate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_translate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real OpenRouter API (needs OPENROUTER_API_KEY)"]
addopts = "-m 'not live'"
